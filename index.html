<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<title>GOODS MANAGER</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#252525;--muted:#777;--line:#e7e3dc;--accent:#343c55;--soft:#eeedf2;--danger:#a33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);position:sticky;top:0;z-index:5}
h1{font-size:21px;letter-spacing:.04em;margin:0} .sub{font-size:11px;color:var(--muted);margin-top:3px}
main{max-width:760px;margin:auto;padding:0 14px 100px}
.tabs{display:flex;background:#e9e6e0;border-radius:13px;padding:4px;margin:8px 0 14px}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px;border-radius:10px;font-weight:700;color:#666}
.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.stat{background:var(--soft);border-radius:13px;padding:12px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:20px;display:block;margin-top:4px}
input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink);min-width:0;width:100%}
button{font:inherit;cursor:pointer}.primary{background:var(--accent);color:white;border:0;border-radius:11px;padding:11px 14px;font-weight:700}.secondary{background:#f0eee9;border:0;border-radius:10px;padding:9px 12px}.iconbtn{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:white;font-size:18px}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}
.product{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}
.thumb{width:62px;height:62px;flex:0 0 62px;border-radius:10px;background:#f0eee9;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#aaa;font-size:11px}
.thumb img{width:100%;height:100%;object-fit:cover}.pinfo{flex:1;min-width:0}.pname{font-weight:700;font-size:14px;line-height:1.35}.meta{font-size:11px;color:var(--muted);margin-top:4px}
.qty{display:flex;align-items:center;gap:5px}.qty b{min-width:19px;text-align:center;font-size:14px}
.pprice{font-size:12px;font-weight:700;text-align:right;white-space:nowrap;margin-top:5px}
.actions{display:flex;gap:6px;margin-top:6px}.tiny{font-size:11px;padding:5px 8px;border-radius:8px;border:0;background:#f0eee9}
.empty{text-align:center;padding:30px 12px;color:var(--muted);font-size:13px}
label{font-size:12px;color:#555;display:block;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}
dialog{border:0;border-radius:18px;width:min(92vw,520px);padding:18px;box-shadow:0 12px 50px #0003;max-height:88vh;overflow:auto}
dialog::backdrop{background:#17171788}.dlghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dlghead h2{font-size:18px;margin:0}
.formactions{display:flex;gap:8px;margin-top:16px}.formactions button{flex:1}
#zoom img{max-width:100%;max-height:70vh;object-fit:contain;display:block;margin:auto}
footer{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#f6f4f0ee;border-top:1px solid var(--line);backdrop-filter:blur(10px);z-index:4}
footer .inner{max-width:760px;margin:auto;display:flex;gap:8px}footer button{flex:1}
.status{display:inline-block;border-radius:20px;background:#eeedf2;padding:3px 8px;font-size:10px;color:#555;margin-top:4px}
@media(min-width:600px){.thumb{width:72px;height:72px;flex-basis:72px}.product{padding:13px 2px}}
</style>
</head>
<body>
<header><h1>GOODS MANAGER</h1><div class="sub">グッズをまとめて、すっきり管理。</div></header>
<main>
  <div class="tabs"><button id="eventTab" class="active">イベント</button><button id="regularTab">通常グッズ</button></div>
  <section class="panel" id="eventInfo">
    <div class="row between"><strong>イベント管理</strong><button class="secondary small" id="eventNameBtn">イベント名を設定</button></div>
    <div class="small muted" id="eventName" style="margin-top:7px">イベント名未設定</div>
  </section>
  <section class="summary">
    <div class="stat"><small>登録商品数</small><strong id="count">0</strong></div>
    <div class="stat"><small>予定合計</small><strong id="total">¥0</strong></div>
  </section>
  <section class="panel">
    <div class="row between"><strong id="listTitle">イベント商品</strong><button class="primary" id="addBtn">＋ 商品を追加</button></div>
    <div class="toolbar"><input id="search" placeholder="商品名・メーカーで検索"><select id="sort"><option value="name">商品名順</option><option value="price">価格が安い順</option><option value="qty">数量が多い順</option></select></div>
    <div id="products"></div>
  </section>
  <section class="panel">
    <div class="row between"><strong>予算</strong><span class="small muted">この端末に保存</span></div>
    <label for="budget">予算（円）</label><input id="budget" type="number" inputmode="numeric" placeholder="例：10000">
    <div class="row between" style="margin-top:10px"><span class="small muted">予算残額</span><strong id="remaining">未設定</strong></div>
  </section>
  <p class="small muted" style="text-align:center;line-height:1.6">試作品 v0.3 · 入力データはこの端末のブラウザ内に保存されます。<br>URL情報の取得はサイトの許可状況により成功しない場合があります。</p>
</main>
<footer><div class="inner"><button class="secondary" id="exportBtn">データを書き出す</button><button class="secondary" id="importBtn">データを読み込む</button></div></footer>
<input type="file" id="importFile" accept="application/json" hidden>
<dialog id="editor">
  <div class="dlghead"><h2 id="dlgTitle">商品を追加</h2><button class="iconbtn" id="closeDlg">×</button></div>
  <form id="productForm">
    <input type="hidden" id="pid">
    <label>商品名 *</label><input id="name" required placeholder="商品名">
    <div class="formgrid">
      <div><label>定価（税込・円）</label><input id="listPrice" type="number" min="0" inputmode="numeric" placeholder="1650"></div>
      <div><label>実際の購入価格（任意）</label><input id="paidPrice" type="number" min="0" inputmode="numeric" placeholder="未入力なら定価"></div>
      <div><label>メーカー・ブランド</label><input id="maker" placeholder="メーカー名"></div>
      <div><label>数量</label><input id="quantity" type="number" min="0" inputmode="numeric" value="0"></div>
      <div class="full"><label>商品ページURL</label><input id="url" type="url" placeholder="https://..."><button type="button" class="secondary" id="fetchUrlBtn" style="margin-top:7px;width:100%">URLから商品情報を取得</button><div class="small muted" id="fetchHelp" style="margin-top:5px">商品名・価格・画像・JANなどを取得できるか試します。サイト側の制限で取得できない場合は、商品ページを開いて手入力できます。</div><button type="button" class="secondary" id="openUrlBtn" style="margin-top:7px;width:100%">商品ページを開く</button></div>
      <div><label>JANコード</label><input id="jan" inputmode="numeric" placeholder="例：4535123..."></div>
      <div><label>発売日</label><input id="releaseDate" placeholder="例：2024年4月下旬"></div>
      <div><label>購入店舗（任意）</label><input id="purchaseStore" placeholder="例：アニメイト"></div><div><label>購入日（任意）</label><input id="purchaseDate" type="date"></div><div class="full"><label>商品画像URL（任意）</label><input id="imageUrl" type="url" placeholder="https://..."></div>
      <div class="full"><label>管理状況</label><select id="status"><option value="欲しい">欲しい</option><option value="予約済み">予約済み</option><option value="購入予定">購入予定</option><option value="購入済み">購入済み</option><option value="探し中">あとで探す</option></select></div>
      <div class="full"><label>商品画像</label><input id="photo" type="file" accept="image/*"><div class="small muted">画像は小さく圧縮して端末内に保存します。</div></div>
    </div>
    <div class="formactions"><button type="button" class="secondary" id="cancelBtn">キャンセル</button><button class="primary" type="submit">保存する</button></div>
  </form>
</dialog>
<dialog id="zoom"><div class="dlghead"><h2 id="zoomTitle">商品画像</h2><button class="iconbtn" id="closeZoom">×</button></div><img id="zoomImg" alt="商品画像"></dialog>
<script>
const DB='goods-manager-db', STORE='items', SETTINGS='settings';
let db, mode='event', items=[], settings={budget:{event:'',regular:''},eventName:''}, pendingPhoto=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore(STORE,{keyPath:'id'});d.createObjectStore(SETTINGS,{keyPath:'key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function req(tx,store,method,...args){return new Promise((resolve,reject)=>{const r=tx.objectStore(store)[method](...args);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function allItems(){return await req(db.transaction(STORE,'readonly'),STORE,'getAll');}
async function saveItem(item){await req(db.transaction(STORE,'readwrite'),STORE,'put',item);await refresh();}
async function saveSetting(key,value){await req(db.transaction(SETTINGS,'readwrite'),SETTINGS,'put',{key,value});}
async function loadSettings(){const all=await req(db.transaction(SETTINGS,'readonly'),SETTINGS,'getAll');all.forEach(x=>settings[x.key]=x.value);}
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
function effectivePrice(p){return p.paidPrice!==''&&p.paidPrice!==null&&p.paidPrice!==undefined?Number(p.paidPrice):Number(p.listPrice||0);}
function currentItems(){return items.filter(x=>x.type===mode);}
async function refresh(){
 items=await allItems();
 const q=$('search').value.trim().toLowerCase(), sort=$('sort').value;
 let arr=currentItems().filter(p=>!q||[p.name,p.maker].join(' ').toLowerCase().includes(q));
 arr.sort((a,b)=>sort==='price'?effectivePrice(a)-effectivePrice(b):sort==='qty'?b.quantity-a.quantity:a.name.localeCompare(b.name,'ja'));
 $('count').textContent=arr.length;
 const total=arr.reduce((s,p)=>s+effectivePrice(p)*Number(p.quantity||0),0);
 $('total').textContent=yen(total);
 const budget=Number(settings.budget[mode]||0);
 $('budget').value=settings.budget[mode]||'';
 $('remaining').textContent=budget?yen(budget-total):'未設定';
 $('remaining').style.color=budget-total<0?'#a33':'inherit';
 $('eventInfo').style.display=mode==='event'?'block':'none';
 $('listTitle').textContent=mode==='event'?'イベント商品':'通常グッズ';
 $('eventName').textContent=settings.eventName||'イベント名未設定';
 const root=$('products');root.innerHTML='';
 if(!arr.length){root.innerHTML='<div class="empty">商品はまだ登録されていません。<br>「＋ 商品を追加」から登録してね。</div>';return;}
 arr.forEach(p=>{
  const el=document.createElement('div');el.className='product';
  const thumb=document.createElement('div');thumb.className='thumb';
  if(p.photo||p.imageUrl){const img=document.createElement('img');img.src=p.photo||p.imageUrl;img.alt=p.name;img.addEventListener('click',()=>showZoom(p));img.onerror=()=>{thumb.textContent='画像なし';};thumb.append(img);thumb.style.cursor='zoom-in';}
  else thumb.textContent='画像なし';
  const info=document.createElement('div');info.className='pinfo';
  const nm=document.createElement('div');nm.className='pname';nm.textContent=p.name;
  const meta=document.createElement('div');meta.className='meta';meta.textContent=(p.maker?p.maker+' · ':'')+'定価 '+yen(p.listPrice);
  const status=document.createElement('span');status.className='status';status.textContent=p.status||'購入予定';
  const actions=document.createElement('div');actions.className='actions';
  const edit=document.createElement('button');edit.className='tiny';edit.textContent='編集';edit.onclick=()=>editItem(p);
  const del=document.createElement('button');del.className='tiny';del.textContent='削除';del.onclick=()=>deleteItem(p);
  actions.append(edit,del);info.append(nm,meta,status,actions);
  const right=document.createElement('div');right.style.textAlign='right';
  const qty=document.createElement('div');qty.className='qty';
  const minus=document.createElement('button');minus.className='iconbtn';minus.textContent='−';minus.onclick=()=>changeQty(p,-1);
  const num=document.createElement('b');num.textContent=p.quantity||0;
  const plus=document.createElement('button');plus.className='iconbtn';plus.textContent='＋';plus.onclick=()=>changeQty(p,1);
  qty.append(minus,num,plus);
  const price=document.createElement('div');price.className='pprice';price.textContent=yen(effectivePrice(p)*Number(p.quantity||0));
  right.append(qty,price);el.append(thumb,info,right);root.append(el);
 });
}
async function changeQty(p,d){p.quantity=Math.max(0,Number(p.quantity||0)+d);await saveItem(p);}
function openEditor(p){pendingPhoto=p?.photo||null;$('productForm').reset();$('pid').value=p?.id||'';$('name').value=p?.name||'';$('listPrice').value=p?.listPrice??'';$('paidPrice').value=p?.paidPrice??'';$('maker').value=p?.maker||'';$('quantity').value=p?.quantity??0;$('url').value=p?.url||'';$('jan').value=p?.jan||'';$('releaseDate').value=p?.releaseDate||'';$('imageUrl').value=p?.imageUrl||'';$('purchaseStore').value=p?.purchaseStore||'';$('purchaseDate').value=p?.purchaseDate||'';$('fetchHelp').textContent='商品名・価格・画像・JANなどを取得できるか試します。サイト側の制限で取得できない場合は、商品ページを開いて手入力できます。';$('status').value=p?.status||'購入予定';$('dlgTitle').textContent=p?'商品を編集':'商品を追加';$('editor').showModal();}
function editItem(p){openEditor(p);}
async function deleteItem(p){if(confirm('「'+p.name+'」を削除する？')){await req(db.transaction(STORE,'readwrite'),STORE,'delete',p.id);await refresh();}}
function showZoom(p){$('zoomTitle').textContent=p.name;$('zoomImg').src=p.photo||p.imageUrl||'';$('zoom').showModal();}
async function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,600/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.68));};img.onerror=reject;img.src=url;});}
function walkProductData(value, out=[]){
 if(Array.isArray(value)){value.forEach(v=>walkProductData(v,out));return out;}
 if(value&&typeof value==='object'){
  const t=value['@type']; if(t==='Product'||(Array.isArray(t)&&t.includes('Product')))out.push(value);
  if(value['@graph'])walkProductData(value['@graph'],out);
  if(value.itemListElement)walkProductData(value.itemListElement,out);
 }
 return out;
}
function fillFromProductData(data, baseUrl){
 const name=data.name||data.title||'';
 const image=typeof data.image==='string'?data.image:Array.isArray(data.image)?(typeof data.image[0]==='string'?data.image[0]:data.image[0]?.url):data.image?.url;
 const brand=typeof data.brand==='string'?data.brand:data.brand?.name;
 const offers=Array.isArray(data.offers)?data.offers[0]:(data.offers||{});
 const price=offers.price||offers.lowPrice||data.price;
 const sku=data.gtin13||data.gtin||data.gtin12||data.sku||data.mpn||'';
 const date=data.releaseDate||data.datePublished||'';
 if(name&&!$('name').value)$('name').value=name;
 if(brand&&!$('maker').value)$('maker').value=brand;
 if(image&&!$('imageUrl').value){try{$('imageUrl').value=new URL(image,baseUrl).href;}catch{}}
 if(price&&!$('listPrice').value){const n=Number(String(price).replace(/[^0-9.]/g,''));if(n)$('listPrice').value=Math.round(n);}
 if(sku&&!$('jan').value)$('jan').value=String(sku);
 if(date&&!$('releaseDate').value)$('releaseDate').value=String(date).slice(0,10);
 return !!(name||image||price||brand||sku||date);
}
$('fetchUrlBtn').onclick=async()=>{
 const u=$('url').value.trim(); if(!u){alert('先に商品ページURLを入力してね');return;}
 $('fetchHelp').textContent='商品ページの情報を確認中…';
 try{
  const parsed=new URL(u); if(!['http:','https:'].includes(parsed.protocol))throw new Error('URL形式が正しくありません');
  const res=await fetch(parsed.href,{mode:'cors',credentials:'omit'}); if(!res.ok) throw new Error('HTTP '+res.status);
  const html=await res.text(); const doc=new DOMParser().parseFromString(html,'text/html');
  const meta=(...keys)=>{for(const k of keys){const e=doc.querySelector(`meta[property="${k}"],meta[name="${k}"]`);if(e?.content)return e.content;}return '';};
  let found=false;
  for(const node of doc.querySelectorAll('script[type="application/ld+json"]')){try{const json=JSON.parse(node.textContent);const products=walkProductData(json);if(products.length){found=fillFromProductData(products[0],parsed.href)||found;}}catch{}}
  const title=meta('og:title','twitter:title')||doc.querySelector('h1')?.textContent?.trim()||doc.title;
  const image=meta('og:image','twitter:image');
  const price=meta('product:price:amount','og:price:amount');
  const brand=meta('product:brand');
  if(title&&!$('name').value)$('name').value=title.trim();
  if(image&&!$('imageUrl').value)$('imageUrl').value=new URL(image,parsed.href).href;
  if(price&&!$('listPrice').value){const n=Number(price.replace(/[^0-9.]/g,''));if(n)$('listPrice').value=Math.round(n);}
  if(brand&&!$('maker').value)$('maker').value=brand;
  found=found||!!(title||image||price||brand);
  $('fetchHelp').textContent=found?'ページから取得できた情報を入力欄に反映したよ。内容を確認して保存してね。':'ページにはアクセスできたけれど、商品情報を見つけられなかったよ。商品名などを確認して入力してね。';
 }catch(err){$('fetchHelp').textContent='このサイトは外部からの読み込みを許可していないみたい。これはiPhoneやアプリの故障ではないよ。下の「商品ページを開く」でページを確認し、商品名・定価などを入力してね。URLはそのまま保存できるよ。';}
};
$('openUrlBtn').onclick=()=>{const u=$('url').value.trim();if(!u){alert('先に商品ページURLを入力してね');return;}try{const x=new URL(u);if(x.protocol==='http:'||x.protocol==='https:')window.open(x.href,'_blank','noopener');else alert('https:// から始まるURLを入力してね');}catch{alert('URLの形式を確認してね');}};
$('photo').addEventListener('change',async e=>{if(e.target.files[0])pendingPhoto=await compressImage(e.target.files[0]);});
$('productForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('pid').value||crypto.randomUUID();const old=items.find(x=>x.id===id)||{};const p={...old,id,type:mode,name:$('name').value.trim(),listPrice:$('listPrice').value===''?0:Number($('listPrice').value),paidPrice:$('paidPrice').value===''?'':Number($('paidPrice').value),maker:$('maker').value.trim(),quantity:Math.max(0,Number($('quantity').value||0)),url:$('url').value.trim(),jan:$('jan').value.trim(),releaseDate:$('releaseDate').value.trim(),imageUrl:$('imageUrl').value.trim(),status:$('status').value,purchaseStore:$('purchaseStore').value.trim(),purchaseDate:$('purchaseDate').value,photo:pendingPhoto};await saveItem(p);$('editor').close();});
$('addBtn').onclick=()=>openEditor();$('closeDlg').onclick=$('cancelBtn').onclick=()=>$('editor').close();$('closeZoom').onclick=()=>$('zoom').close();
$('eventTab').onclick=()=>setMode('event');$('regularTab').onclick=()=>setMode('regular');
function setMode(m){mode=m;$('eventTab').classList.toggle('active',m==='event');$('regularTab').classList.toggle('active',m==='regular');refresh();}
$('search').oninput=refresh;$('sort').onchange=refresh;
$('budget').onchange=async()=>{settings.budget[mode]=$('budget').value;await saveSetting('budget',settings.budget);refresh();};
$('eventNameBtn').onclick=async()=>{const n=prompt('イベント名を入力してね',settings.eventName||'');if(n!==null){settings.eventName=n;await saveSetting('eventName',n);refresh();}};
$('exportBtn').onclick=async()=>{const data={version:2,items:await allItems(),settings,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='goods-manager-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.items))throw Error('形式が違います');const tx=db.transaction([STORE,SETTINGS],'readwrite');data.items.forEach(p=>tx.objectStore(STORE).put(p));if(data.settings){settings=data.settings;Object.entries(settings).forEach(([k,v])=>tx.objectStore(SETTINGS).put({key:k,value:v}));}tx.oncomplete=refresh;alert('読み込みました');}catch(err){alert('読み込めませんでした：'+err.message)}e.target.value='';};
(async()=>{db=await openDB();await loadSettings();if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});await refresh();})();
</script>
</body></html>
